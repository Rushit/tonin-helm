# Release workflow for tonin-helm
#
# Triggered by pushing a vX.Y.Z tag (via `make release VERSION=X.Y.Z`).
#
# Jobs:
#   verify        — tag matches Cargo.toml version
#   test          — full `make ci` gate at the tagged commit
#   create-release — open a draft GitHub Release so binary uploads have a target
#   build-binaries — cross-platform tonin-helm binaries, uploaded to the Release
#   publish-crate  — cargo publish to crates.io
#                    NOTE: blocked until tonin-plugin is on crates.io (the path
#                    dep in Cargo.toml must be replaced with a registry dep first).
#                    This step is skipped automatically until then.
#   finalize-release — flip draft → published once all jobs succeed
#
# Binary targets:
#   x86_64-unknown-linux-gnu   (Linux x86_64)
#   aarch64-unknown-linux-gnu  (Linux ARM64)
#   x86_64-apple-darwin        (macOS Intel)
#   aarch64-apple-darwin       (macOS Apple Silicon)
#   x86_64-pc-windows-msvc     (Windows x86_64)
#
# Required secrets:
#   GITHUB_TOKEN          — auto-provided, used for Release assets
#   CARGO_REGISTRY_TOKEN  — crates.io API token (Settings → Secrets → Actions)

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.2.0) — emergency manual run only'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # Verify the pushed tag matches the version in Cargo.toml.
  # -------------------------------------------------------------------------
  verify:
    name: Verify tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.version }}"
          else
            REF="${{ github.ref_name }}"
          fi
          TAG_VERSION="${REF#v}"
          CARGO_VERSION="$(
            awk '
              /^\[package\]/ { in_section=1; next }
              /^\[/ && in_section { in_section=0 }
              in_section && /^version[[:space:]]*=/ {
                match($0, /"[^"]+"/)
                print substr($0, RSTART+1, RLENGTH-2)
                exit
              }
            ' Cargo.toml
          )"
          echo "Tag version:   ${TAG_VERSION}"
          echo "Cargo.toml:    ${CARGO_VERSION}"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag ${REF} does not match Cargo.toml version (${CARGO_VERSION})." >&2
            echo "::error::Run: make release VERSION=${CARGO_VERSION}" >&2
            exit 1
          fi

  # -------------------------------------------------------------------------
  # Full CI gate at the tagged commit.
  # -------------------------------------------------------------------------
  test:
    name: Test (make ci)
    needs: verify
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout tonin-helm
        uses: actions/checkout@v4
        with:
          path: tonin-helm

      - name: Read tonin-plugin version
        id: plugin
        run: |
          ver=$(grep 'tonin-plugin' tonin-helm/Cargo.toml \
                | grep -oP '(?<=version = ")[^"]+' | head -1)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Checkout tonin at v${{ steps.plugin.outputs.ver }}
        uses: actions/checkout@v4
        with:
          repository: Rushit/tonin
          ref: v${{ steps.plugin.outputs.ver }}
          path: tonin

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tonin-helm

      - name: make ci
        working-directory: tonin-helm
        run: make ci

  # -------------------------------------------------------------------------
  # Create a draft Release so binary upload jobs have a target.
  # -------------------------------------------------------------------------
  create-release:
    name: Create draft Release ${{ github.ref_name }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false

  # -------------------------------------------------------------------------
  # Cross-platform binary builds.
  # -------------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tonin-helm
        uses: actions/checkout@v4
        with:
          path: tonin-helm

      - name: Read tonin-plugin version
        id: plugin
        shell: bash
        run: |
          ver=$(grep 'tonin-plugin' tonin-helm/Cargo.toml \
                | grep -oP '(?<=version = ")[^"]+' | head -1)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Checkout tonin at v${{ steps.plugin.outputs.ver }}
        uses: actions/checkout@v4
        with:
          repository: Rushit/tonin
          ref: v${{ steps.plugin.outputs.ver }}
          path: tonin

      - name: Install Rust 1.90 + target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tonin-helm
          key: ${{ matrix.target }}

      - name: Build and upload tonin-helm
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tonin-helm
          target: ${{ matrix.target }}
          archive: tonin-helm-$target
          tar: unix
          zip: windows
          checksum: sha256
          manifest-path: tonin-helm/Cargo.toml
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # Publish to crates.io.
  # TODO: enable once tonin-plugin is published to crates.io and the path
  # dep in Cargo.toml is replaced with a plain version constraint.
  # -------------------------------------------------------------------------
  publish-crate:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Check if publishable (no path deps)
        id: can-publish
        run: |
          # Skip publish if Cargo.toml still has a path dep on tonin-plugin.
          if grep -q 'tonin-plugin.*path' "$GITHUB_WORKSPACE/../tonin-helm/Cargo.toml" 2>/dev/null || \
             [ ! -f "$GITHUB_WORKSPACE/../tonin-helm/Cargo.toml" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tonin-helm
        if: steps.can-publish.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Install Rust 1.90
        if: steps.can-publish.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"

      - name: Cache cargo
        if: steps.can-publish.outputs.skip == 'false'
        uses: Swatinem/rust-cache@v2

      - name: cargo publish
        if: steps.can-publish.outputs.skip == 'false'
        run: cargo publish -p tonin-helm

      - name: Skip notice
        if: steps.can-publish.outputs.skip == 'true'
        run: |
          echo "::notice::crates.io publish skipped — tonin-plugin path dep still present."
          echo "::notice::Publish manually once tonin-plugin >= 0.5.2 is on crates.io."

  # -------------------------------------------------------------------------
  # Flip draft Release to published once binaries and publish both succeed.
  # -------------------------------------------------------------------------
  finalize-release:
    name: Finalize GitHub Release
    needs: [publish-crate, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
